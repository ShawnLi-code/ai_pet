<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Pet Companion</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="stage" aria-label="Agent pet status">
        <div class="pet" id="pet" data-mood="idle">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="face">
            <span class="eye"></span>
            <span class="eye"></span>
            <span class="mouth"></span>
          </div>
          <div class="body"></div>
          <div class="shadow"></div>
        </div>
      </section>
      <aside class="panel">
        <p class="label">Agent Pet</p>
        <h1 id="status">Idle</h1>
        <p id="detail">Waiting for Claude Code or Codex.</p>
        <div class="agents" id="agents"></div>
      </aside>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
